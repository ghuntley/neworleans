[package]
name = "orleans-event-sourcing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Event sourcing infrastructure for Orleans grains - audit trails, temporal queries, and state reconstruction"

[dependencies]
orleans-core = { path = "../orleans-core" }
orleans-persistence = { path = "../orleans-persistence" }
orleans-transactions = { path = "../orleans-transactions" }

tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-test = { workspace = true }
proptest = { workspace = true }
