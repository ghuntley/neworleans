[package]
name = "orleans-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for Orleans grain code generation"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
orleans-core = { path = "../orleans-core" }
orleans-runtime = { path = "../orleans-runtime" }
orleans-messaging = { path = "../orleans-messaging" }
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bytes.workspace = true
