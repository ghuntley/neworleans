[package]
name = "orleans-tests-integration"
version = "0.1.0"
edition = "2021"
description = "Real network integration testing framework for Orleans-RS"
license = "MIT"

[dependencies]
# Orleans crates
orleans-core = { path = "../orleans-core" }
orleans-clustering = { path = "../orleans-clustering" }
orleans-directory = { path = "../orleans-directory" }
orleans-messaging = { path = "../orleans-messaging" }
orleans-runtime = { path = "../orleans-runtime" }
orleans-host = { path = "../orleans-host" }
orleans-telemetry = { path = "../orleans-telemetry" }

# Async runtime
tokio = { version = "1", features = ["full", "process", "time", "sync", "io-util"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Utilities
tracing = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
parking_lot = "0.12"

[dev-dependencies]
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[test]]
name = "cluster_formation"
path = "tests/cluster_formation.rs"

[[test]]
name = "grain_communication"
path = "tests/grain_communication.rs"

[[test]]
name = "failure_scenarios"
path = "tests/failure_scenarios.rs"

[[test]]
name = "performance_baseline"
path = "tests/performance_baseline.rs"

[[bench]]
name = "cross_silo_latency"
harness = false
