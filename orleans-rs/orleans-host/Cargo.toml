[package]
name = "orleans-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orleans silo host assembly - combines all components into a runnable silo process"

[dependencies]
orleans-core = { path = "../orleans-core" }
orleans-serialization = { path = "../orleans-serialization" }
orleans-messaging = { path = "../orleans-messaging" }
orleans-clustering = { path = "../orleans-clustering" }
orleans-directory = { path = "../orleans-directory" }
orleans-runtime = { path = "../orleans-runtime" }

tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
