[workspace]
resolver = "2"
members = [
    "orleans-core",
    "orleans-serialization",
    "orleans-messaging",
    "orleans-clustering",
    "orleans-directory",
    "orleans-runtime",
    "orleans-codegen",
    "orleans-telemetry",
    "orleans-persistence",
    "orleans-timers",
    "orleans-reminders",
    "orleans-filters",
    "orleans-observers",
    "orleans-streaming",
    "orleans-transactions",
    "orleans-versioning",
    "orleans-client",
    "orleans-stateless-workers",
    "orleans-placement",
    "orleans-security",
    "orleans-migration",
    "orleans-postgres",
    "orleans-persistence-s3",
    "orleans-event-sourcing",
    "orleans-host",
    "orleans-tests-integration",
    "orleans-chaos",
    "orleans-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dotnet/orleans"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }
async-trait = "0.1"
bytes = "1"
dashmap = "5"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "1"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-test = "0.4"
lru = "0.12"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
rand = "0.8"
